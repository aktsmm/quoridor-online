# Publishes the front end to Static Web Apps.
#
# The server URL is not known at commit time (it is the Container App's
# generated FQDN), so it is read from Azure and baked into the bundle here.
# Static Web Apps has no OIDC upload path, so the deployment token is fetched
# at run time with the same federated identity instead of being stored.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/engine/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  APP_NAME: ca-quoridor
  SITE_NAME: swa-quoridor
  RESOURCE_GROUP: rg-quoridor-online

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the game server URL
        id: server
        run: |
          fqdn=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://${fqdn}" >> "$GITHUB_OUTPUT"

      - name: Wait for a compatible game server
        env:
          SERVER_URL: ${{ steps.server.outputs.url }}
        run: |
          expected=$(sed -nE 's/export const PROTOCOL_VERSION = ([0-9]+);/\1/p' \
             packages/web/src/net/protocol.ts)
          if [ -z "$expected" ]; then
             echo "::error::could not read the expected protocol version"
             exit 1
          fi

          # The protocol version deliberately stays put for additive changes,
          # so on its own it cannot tell an old server from a new one. Every
          # optional capability the bundle knows about is checked as well, which
          # is what actually holds this deploy back until the server has rolled.
          features=$(sed -nE "s/^export const FEATURE_[A-Z0-9_]+ = '([^']+)';.*/\1/p" \
             packages/web/src/net/protocol.ts)
          echo "requiring protocol=${expected} features=[${features}]"

          for attempt in $(seq 1 120); do
             body=$(curl -fsS --max-time 60 "${SERVER_URL}/health" || echo '')
             actual=0
             if [ -n "$body" ]; then
               actual=$(echo "$body" | jq -r '.protocolVersion // 0' 2>/dev/null || echo 0)
             fi

             missing=''
             for feature in $features; do
               have=$(echo "$body" | jq -r --arg f "$feature" \
                 'if ((.features // []) | index($f)) == null then "no" else "yes" end' \
                 2>/dev/null || echo no)
               if [ "$have" != "yes" ]; then
                 missing="${missing} ${feature}"
               fi
             done

             echo "attempt ${attempt}: server protocol=${actual}, expected=${expected}, missing=[${missing# }]"
             if [ "$actual" -eq "$expected" ] && [ -z "$missing" ]; then
               exit 0
             fi
             sleep 15
          done

          echo "::error::compatible game server was not available after 30 minutes"
          exit 1

      - run: npm ci

      - name: Build
        env:
          VITE_SERVER_URL: ${{ steps.server.outputs.url }}
        run: |
          # The web bundle imports the rules engine from its build output, so
          # that workspace has to be compiled first.
          npx tsc -b packages/engine
          npm run build --workspace @quoridor/web

      - name: Read the deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "$SITE_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: packages/web/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Report the public URL
        run: |
          host=$(az staticwebapp show \
            --name "$SITE_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "defaultHostname" -o tsv)
          echo "web: https://${host}" >> "$GITHUB_STEP_SUMMARY"
