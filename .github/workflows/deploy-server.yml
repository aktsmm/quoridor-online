# Builds the game server image in Actions (this machine cannot reach the npm
# registry from inside Docker) and points the Container App at the new digest.
#
# Secretless end to end: GHCR is written with the job's own GITHUB_TOKEN, and
# Azure is reached through the `id-quoridor-deploy` user-assigned identity via
# OIDC. The identity holds Contributor on the Container App resource only.
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - 'packages/ai/**'
      - 'packages/server/**'
      - 'Dockerfile'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even while games are in progress'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/server
  APP_NAME: ca-quoridor
  RESOURCE_GROUP: rg-quoridor-online

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A new revision restarts the replica. Room snapshots survive that, but
      # every player still pays a reconnect, so wait for the tables to clear.
      - name: Wait for games in progress to finish
        if: ${{ inputs.force != true }}
        run: |
          fqdn=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          for attempt in $(seq 1 20); do
            body=$(curl -fsS --max-time 60 "https://${fqdn}/health" || echo '')
            if [ -z "$body" ]; then
              echo "health check failed; the replica is probably cold, deploying anyway"
              exit 0
            fi
            active=$(echo "$body" | jq -r '.activeGames // 0')
            echo "attempt ${attempt}: activeGames=${active}"
            if [ "$active" -eq 0 ]; then
              exit 0
            fi
            sleep 30
          done

          echo "::error::games still in progress after 10 minutes; re-run with force=true to override"
          exit 1

      - name: Point the container app at the new image
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build.outputs.image }}" \
            --output none

      - name: Report the public endpoint
        run: |
          fqdn=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "server: https://${fqdn}" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 90 "https://${fqdn}/health"
